<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Archive Lifeboat</title>
    <style>
      :root {
        --paper: #f1ead8;
        --ink: #162526;
        --orange: #e15d35;
        --green: #1c7969;
        --line: #b8ad91;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.5 Arial,
          sans-serif;
        overflow-x: hidden;
      }
      .head {
        height: 86px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4vw;
      }
      .head h1 {
        font:
          italic 34px/1 Georgia,
          serif;
        margin: 0;
      }
      .head small {
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .wallet {
        border: 0;
        border-bottom: 2px solid var(--ink);
        background: none;
        padding: 8px 0;
      }
      .bench {
        min-height: calc(100vh - 86px);
        display: grid;
        grid-template-columns: 88px 1fr;
      }
      .tools {
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 0;
        gap: 22px;
      }
      .tool {
        writing-mode: vertical-rl;
        background: none;
        border: 0;
        color: var(--ink);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 10px;
        cursor: pointer;
      }
      .tool.active {
        color: var(--orange);
      }
      .table {
        position: relative;
        padding: 46px 5vw 80px;
        overflow: hidden;
      }
      .registration {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 8px;
        color: #7c735f;
        font:
          10px ui-monospace,
          monospace;
      }
      .film-window {
        margin-top: 54px;
        position: relative;
        height: 370px;
      }
      .strip {
        position: absolute;
        left: -8vw;
        width: 116vw;
        height: 68px;
        border-top: 1px solid #8f846b;
        border-bottom: 1px solid #8f846b;
        background: linear-gradient(
          90deg,
          #ffffff35 0 9%,
          #e15d3518 9% 10%,
          #ffffff35 10% 100%
        );
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 10vw;
        font:
          12px ui-monospace,
          monospace;
        white-space: nowrap;
        transition: 0.5s;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .strip:before {
        content: attr(data-no);
        color: var(--orange);
        font-weight: bold;
      }
      .s1 {
        top: 0;
      }
      .s2 {
        top: 96px;
        transform: translateX(-5vw);
      }
      .s3 {
        top: 192px;
        transform: translateX(4vw);
      }
      .s4 {
        top: 288px;
        transform: translateX(-2vw);
      }
      .film-window.clamped .strip {
        transform: translateX(0);
        box-shadow: 0 7px 20px #786d5720;
      }
      .strip.active {
        background: linear-gradient(
          90deg,
          #ffffff35 0 9%,
          #e15d3540 9% 10%,
          #ffffffa0 10% 100%
        );
        color: var(--orange);
      }
      .loupe {
        position: absolute;
        z-index: 4;
        left: 42%;
        top: 68px;
        width: 190px;
        height: 190px;
        border: 13px solid #233b3b;
        border-radius: 50%;
        box-shadow:
          0 12px 25px #0004,
          0 0 0 2px #d7c8a7 inset;
        background: #f7f0dfaa;
        backdrop-filter: blur(2px);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 25px;
        font:
          12px ui-monospace,
          monospace;
        cursor: grab;
      }
      .loupe:after {
        content: "";
        position: absolute;
        width: 100px;
        height: 18px;
        background: #233b3b;
        right: -82px;
        bottom: -24px;
        transform: rotate(42deg);
      }
      .splicer {
        position: absolute;
        z-index: 7;
        right: 5vw;
        top: 36px;
        width: 330px;
        background: #162526;
        color: var(--paper);
        padding: 22px;
        transform: translateX(calc(100% + 5vw + 48px));
        transition: transform 0.35s ease;
        box-shadow: 0 18px 40px #0003;
      }
      .splicer.open {
        transform: translateX(0);
      }
      .splicer small {
        color: #c9bfa8;
        letter-spacing: 0.15em;
      }
      .splicer h2 {
        margin: 7px 0 18px;
        font: italic 28px Georgia, serif;
      }
      .splicer input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #c9bfa8;
        background: transparent;
        color: white;
        padding: 10px 0;
        font: 11px ui-monospace, monospace;
      }
      .splice-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 18px;
      }
      .splice-actions button {
        border: 1px solid #c9bfa8;
        background: none;
        color: var(--paper);
        padding: 10px;
      }
      .splice-actions .launch {
        background: var(--orange);
        border-color: var(--orange);
      }
      .seal {
        position: absolute;
        right: 5vw;
        bottom: 24px;
        width: 110px;
        height: 110px;
        border: 2px solid var(--orange);
        color: var(--orange);
        border-radius: 50%;
        display: grid;
        place-items: center;
        transform: rotate(-8deg);
        font:
          700 12px ui-monospace,
          monospace;
        text-align: center;
        opacity: 0.2;
      }
      .seal.on {
        opacity: 1;
      }
      .status {
        position: absolute;
        left: 5vw;
        bottom: 25px;
        font:
          11px ui-monospace,
          monospace;
        color: var(--green);
      }
      .toast {
        position: fixed;
        top: 100px;
        right: 30px;
        background: var(--ink);
        color: var(--paper);
        padding: 12px 16px;
        opacity: 0;
        transition: 0.2s;
        z-index: 20;
      }
      .toast.on {
        opacity: 1;
      }
      @media (max-width: 760px) {
        .bench {
          grid-template-columns: 52px 1fr;
        }
        .splicer {
          right: 18px;
          width: min(330px, calc(100% - 36px));
        }
        .loupe {
          left: 24%;
          transform: scale(0.8);
        }
        .head h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header class="head">
      <div>
        <h1>Archive Lifeboat</h1>
        <small>conservation bench / L-03</small>
      </div>
      <button class="wallet" id="connect">connect wallet</button>
    </header>
    <main class="bench">
      <nav class="tools">
        <button class="tool active" id="load">load strips</button
        ><button class="tool" id="inspect">inspect fidelity</button
        ><button class="tool" id="seal">seal capsule</button
        ><button class="tool" id="read">read receipt</button>
      </nav>
      <section class="table">
        <div class="registration">
          <span id="capsuleTag">ORIGIN · MIRROR A · MIRROR B · POLICY</span
          ><span id="state">UNLOADED</span>
        </div>
        <div class="film-window" id="films">
          <button class="strip s1" data-no="01" data-strip="0">
            ORIGIN / source record / content + context + authorship
          </button>
          <button class="strip s2" data-no="02" data-strip="1">
            MIRROR A / first independent preservation copy
          </button>
          <button class="strip s3" data-no="03" data-strip="2">
            MIRROR B / second independent preservation copy
          </button>
          <button class="strip s4" data-no="04" data-strip="3">
            POLICY / the facets that must survive
          </button>
          <div class="loupe" id="loupe">
            Move through the four strips.<br />Nothing is assumed preserved.
          </div>
          <section class="splicer" id="splicer">
            <small id="editorCount">STRIP 01 / 04</small>
            <h2 id="editorRole">Origin</h2>
            <input id="sourceUrl" aria-label="Active source URL" />
            <div class="splice-actions">
              <button id="nextStrip">advance film</button>
              <button class="launch" id="launch">clamp + launch</button>
            </div>
          </section>
        </div>
        <div class="status" id="status">READY / LOAD A CAPSULE</div>
        <div class="seal" id="stamp">PRESERVATION<br />RECORD</div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script type="module">
      import { createClient } from "https://esm.sh/genlayer-js@1.1.8";
      import { studionet } from "https://esm.sh/genlayer-js@1.1.8/chains";
      const ADDRESS = "0xC8f3D140b023415bf4874DC09553F7Ebc0Ed6f3c",
        ENDPOINT = "https://studio.genlayer.com/api",
        $ = (s) => document.querySelector(s);
      let client,
        activeStrip = 0,
        currentId = "";
      const sources = [
        {
          role: "Origin",
          value:
            "https://raw.githubusercontent.com/sanshos1/archive-lifeboat/main/fixtures/origin.txt",
        },
        {
          role: "Mirror A",
          value:
            "https://raw.githubusercontent.com/sanshos1/archive-lifeboat/main/fixtures/mirror-a.txt",
        },
        {
          role: "Mirror B",
          value:
            "https://raw.githubusercontent.com/sanshos1/archive-lifeboat/main/fixtures/mirror-b.txt",
        },
        {
          role: "Preservation policy",
          value:
            "https://raw.githubusercontent.com/sanshos1/archive-lifeboat/main/fixtures/policy.txt",
        },
      ];
      const toast = (x, sticky = false) => {
          let e = $("#toast");
          e.textContent = x?.message || x;
          e.classList.add("on");
          if (!sticky) setTimeout(() => e.classList.remove("on"), 4200);
        },
        status = (x) => ($("#status").textContent = x);
      async function connect() {
        if (!window.ethereum) throw Error("Install MetaMask or Rabby.");
        const [a] = await ethereum.request({ method: "eth_requestAccounts" });
        client = createClient({
          chain: studionet,
          endpoint: ENDPOINT,
          account: a,
          provider: ethereum,
        });
        $("#connect").textContent = a.slice(0, 6) + "…" + a.slice(-4);
        return client;
      }
      async function send(fn, args) {
        const c = client || (await connect());
        status("SUBMITTED / " + fn.toUpperCase());
        const hash = await c.writeContract({
          address: ADDRESS,
          functionName: fn,
          args,
          value: 0n,
        });
        status("ACCEPTED / WAITING FOR FINALIZED");
        const r = await c.waitForTransactionReceipt({
          hash,
          status: "FINALIZED",
          retries: 180,
          interval: 5000,
        });
        if (
          String(r.result_name ?? r.resultName ?? "").toUpperCase() !==
          "MAJORITY_AGREE"
        )
          throw Error("FINALIZED WITHOUT AGREEMENT");
        status("FINALIZED / " + fn.toUpperCase());
        return hash;
      }
      async function read() {
        if (!currentId) throw Error("Launch a capsule on this bench first.");
        const c =
          client || createClient({ chain: studionet, endpoint: ENDPOINT });
        const x = await c.readContract({
          address: ADDRESS,
          functionName: "get_capsule",
          args: [currentId],
        });
        $("#state").textContent =
          x.state + " / " + (x.verdict || "AWAITING INSPECTION");
        $("#loupe").textContent = x.verdict
          ? "A " +
            JSON.stringify(x.mirror_a) +
            "\nB " +
            JSON.stringify(x.mirror_b)
          : "Four source digests frozen.";
        $("#films").classList.toggle("clamped", x.state !== "AFLOAT");
        $("#stamp").classList.toggle("on", x.state === "SEALED");
        status(
          x.state +
            " / " +
            ((x.reason_codes || []).join(" · ") || "SOURCES FROZEN"),
        );
        return x;
      }
      function showStrip(index) {
        activeStrip = index;
        document
          .querySelectorAll("[data-strip]")
          .forEach((strip, i) => strip.classList.toggle("active", i === index));
        $("#editorCount").textContent =
          `STRIP ${String(index + 1).padStart(2, "0")} / 04`;
        $("#editorRole").textContent = sources[index].role;
        $("#sourceUrl").value = sources[index].value;
        $("#splicer").classList.add("open");
        $("#loupe").textContent =
          `Inspecting ${sources[index].role}. Advance the film when the source is correct.`;
      }
      function saveActive() {
        sources[activeStrip].value = $("#sourceUrl").value.trim();
      }
      document.querySelectorAll("[data-strip]").forEach((strip) => {
        strip.onclick = () => showStrip(Number(strip.dataset.strip));
      });
      $("#connect").onclick = () => connect().catch((e) => toast(e, true));
      $("#load").onclick = () => showStrip(0);
      $("#nextStrip").onclick = () => {
        saveActive();
        showStrip((activeStrip + 1) % sources.length);
      };
      $("#launch").onclick = async () => {
        try {
          saveActive();
          currentId = `LIFEBOAT-${Date.now().toString().slice(-10)}`;
          $("#capsuleTag").textContent = currentId + " · FOUR STRIPS ALIGNED";
          await send("launch", [
            currentId,
            "Conservation bench preservation set",
            sources[0].value,
            sources[1].value,
            sources[2].value,
            sources[3].value,
          ]);
          $("#splicer").classList.remove("open");
          await read();
        } catch (e) {
          toast(e, true);
        }
      };
      $("#inspect").onclick = async () => {
        try {
          await send("inspect", [currentId]);
          await read();
        } catch (e) {
          toast(e, true);
        }
      };
      $("#seal").onclick = async () => {
        try {
          await send("seal", [currentId]);
          await read();
        } catch (e) {
          toast(e, true);
        }
      };
      $("#read").onclick = () => read().catch((e) => toast(e, true));
    </script>
  </body>
</html>
